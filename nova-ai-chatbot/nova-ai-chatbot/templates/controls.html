<div class="swatches" role="group" aria-label="Accent colour">
  <button type="button" class="sw" data-theme="ocean" title="Ocean" aria-label="Ocean theme"></button>
  <button type="button" class="sw" data-theme="sunset" title="Sunset" aria-label="Sunset theme"></button>
  <button type="button" class="sw" data-theme="forest" title="Forest" aria-label="Forest theme"></button>
  <button type="button" class="sw" data-theme="grape" title="Grape" aria-label="Grape theme"></button>
</div>
<button type="button" class="icon darkBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
  <svg class="i i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="i i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
</button>
